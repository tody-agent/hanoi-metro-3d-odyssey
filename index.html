<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hanoi Metro 3D Odyssey — Mô Hình Hedonic Đa Tầng &amp; GIS (N = 16.471)</title>
  <meta name="description" content="Hệ thống trực quan hóa dữ liệu không gian 3D (Spatial Data Science) và kiểm định kinh tế lượng Hedonic 3 tầng không gian (Vành đai Đô thị • 21 Phường mới Chính quyền 2 cấp • 7 Tiểu thị trường lịch sử, N = 16.471 căn hộ) dọc hành lang Tuyến Metro 2A &amp; Tuyến 3 Hà Nội." />
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --bg-deep: #040914;
      --slate-900: rgba(10, 18, 34, 0.92);
      --slate-800: rgba(30, 41, 59, 0.88);
      --border-glass: rgba(148, 163, 184, 0.26);
      --emerald: #10b981;
      --emerald-light: #34d399;
      --blue: #3b82f6;
      --amber: #f59e0b;
      --rose: #f43f5e;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #canvas3d {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
      z-index: 1;
    }
    #canvas3d:active {
      cursor: grabbing;
    }

    /* Top Minimal Floating Navigation */
    .hud-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
      flex-wrap: wrap;
    }
    .pill-group {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--slate-900);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 9999px;
      padding: 4px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      max-width: 100%;
    }

    .nav-btn {
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 13px;
      border-radius: 9999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .nav-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }
    .nav-btn.active {
      background: var(--emerald);
      color: #022c22;
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.4);
    }

    .action-group {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }
    .icon-pill {
      border: 1px solid var(--border-glass);
      background: var(--slate-900);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #f1f5f9;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 9999px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }
    .icon-pill:hover {
      border-color: var(--emerald-light);
    }
    .icon-pill.active-mode {
      background: rgba(16, 185, 129, 0.22);
      border-color: var(--emerald-light);
      color: var(--emerald-light);
    }

    /* Bottom Compact Dock — Automatically hides whenever Data Sheet opens to prevent any overlap */
    .hud-bottom {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: calc(100% - 24px);
      max-width: 580px;
      pointer-events: auto;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .hud-bottom.hidden-bar {
      display: none !important;
      opacity: 0;
      pointer-events: none;
    }
    .prompt-card {
      background: var(--slate-900);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 10px 14px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55);
    }
    .prompt-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .prompt-info {

      flex: 1;
    }
    .prompt-tag {
      font-size: 12px;
      font-weight: 700;
      color: var(--emerald-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .prompt-sub {
      font-size: 12px;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .cta-btn {
      border: none;
      background: var(--emerald);
      color: #022c22;
      font-weight: 700;
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 12px;

      transition: all 0.2s ease;

    /* Interactive Cự Ly Controls inside Bottom Bar (No line wrapping!) */

      padding-top: 8px;

      font-weight: 500;

      border-radius: 12px;
      background: rgba(15, 23, 42, 0.85);
      border-left: 3px solid var(--emerald);

      border-right: 1px solid rgba(148, 163, 184, 0.18);
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);

      font-size: 12px;

<body>

  <!-- FULLSCREEN 3D MAP CANVAS -->
  <canvas id="canvas3d"></canvas>

  <!-- TOP MINIMAL NAVIGATION (4 STEPS FIT PERFECTLY ON BOTH MOBILE & DESKTOP) -->
  <header class="hud-top">
    <nav class="pill-group" aria-label="Các bước phân tích">

  <!-- BOTTOM INTERACTIVE DOCK (HIDES AUTOMATICALLY WHEN DATA SHEET OPENS) -->
  <div id="bottom-bar" class="hud-bottom">
    <div class="prompt-card">
      <div class="prompt-top-row">
        <div class="prompt-info">
          <div id="bar-title" class="prompt-tag">DỮ LIỆU KHÔNG GIAN 3D • N = 16.471 CĂN HỘ (ĐỊNH DANH KHÔNG GIAN 3 TẦNG)</div>
          <div id="bar-sub" class="prompt-sub">Chọn tòa nhà/nhà ga 3D để xem 3 tầng không gian (Vành đai Đô thị • Phường mới 2 cấp • Tiểu thị trường lịch sử)</div>
        </div>
        <button onclick="openSheet('summary')" id="bar-cta" class="cta-btn">Bảng Số Liệu ↑</button>

      <!-- STEP 2: INTERACTIVE 3D DISTANCE SIMULATOR -->
      <div id="exp-step2" class="exp-controls">
        <div class="slider-meta-row">
          <span style="color:#cbd5e1;">Cự ly đi bộ mạng lưới GIS: <strong id="exp-dist-txt" style="color:#34d399;">750 m (~9 phút)</strong></span>
          <span id="exp-zone-badge" style="color:#6ee7b7;font-weight:700;">Vành đai 500–1000m: +3.91% ***</span>
        </div>
        <input type="range" id="exp-slider" min="150" max="1750" step="25" value="750" class="calc-range" oninput="updateExperimentDist(this.value)" />
        <div class="preset-row">

          <button onclick="updateExperimentDist(1550)" id="chip-far" class="preset-chip">&gt;1500m: 0.00% (Ref)</button>
        </div>

      <!-- STEP 3: 3-TIER SPATIAL FIXED EFFECTS VS RAW PRICE SWITCH -->
      <div id="exp-step3" class="exp-controls">
        <div class="preset-row-2">
          <button onclick="setProofView('bonus')" id="chip-proof-bonus" class="preset-chip active-chip">Mô hình 3–5: Kiểm soát Không gian 3 Tầng (FE)</button>
          <button onclick="setProofView('raw')" id="chip-proof-raw" class="preset-chip">Giá chào bán thực tế (tr/m²)</button>

  <!-- ON-DEMAND DATA SCIENCE SHEET (HIDDEN BY DEFAULT) -->
  <section id="info-sheet" class="info-sheet closed" aria-live="polite">
    <div class="sheet-header">
      <span id="sheet-badge" class="sheet-badge">PHÂN TÍCH DỮ LIỆU & KIỂM ĐỊNH THỐNG KÊ</span>

    </div>
    <div id="sheet-content" class="sheet-body"></div>
  </section>

  <!-- ========================================================================= -->
  <!-- ARCHITECTURAL 3D ENGINE + SPATIAL DATA SCIENCE & HEDONIC ECONOMETRICS     -->
  <!-- ========================================================================= -->
  <script>
    // =========================================================================
    // 1. REAL WGS84 GPS PROJECTION (CENTER: TRUNG HÒA - NGÃ TƯ SỞ)
    // =========================================================================
    const LAT0 = 21.0105;
    const LON0 = 105.8015;
    const SCALE_KM = 8.8;

    function gpsToWorld(lat, lon) {
      return {
        x: (lon - LON0) * 103.93 * SCALE_KM,
        z: -(lat - LAT0) * 111.13 * SCALE_KM
      };
    }

    function interpolateSpline(gpsList, subdivisions = 8) {
      const raw = gpsList.map(p => ({
        ...gpsToWorld(p[0], p[1]),
        elev: p[2] !== undefined ? p[2] : 0
      }));
      if (raw.length < 2) return raw;

      const out = [];
      for (let i = 0; i < raw.length - 1; i++) {
        const p0 = raw[Math.max(0, i - 1)];
        const p1 = raw[i];
        const p2 = raw[i + 1];
        const p3 = raw[Math.min(raw.length - 1, i + 2)];

        for (let s = 0; s < subdivisions; s++) {
          const t = s / subdivisions, t2 = t * t, t3 = t2 * t;
          const x = 0.5 * ((2 * p1.x) + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3);
          const z = 0.5 * ((2 * p1.z) + (-p0.z + p2.z) * t + (2 * p0.z - 5 * p1.z + 4 * p2.z - p3.z) * t2 + (-p0.z + 3 * p1.z - 3 * p2.z + p3.z) * t3);
          const elev = p1.elev + (p2.elev - p1.elev) * t;
          out.push({ x, z, elev });
        }
      }
      out.push({ ...raw[raw.length - 1] });

      for (let i = 0; i < out.length; i++) {
        const prev = out[Math.max(0, i - 1)];
        const next = out[Math.min(out.length - 1, i + 1)];
        const dx = next.x - prev.x;
        const dz = next.z - prev.z;
        const len = Math.hypot(dx, dz) || 1;
        out[i].tx = dx / len;
        out[i].tz = dz / len;
        out[i].nx = -out[i].tz;
        out[i].nz = out[i].tx;
      }
      return out;
    }

    // =========================================================================
    // 2. OPENSTREETMAP / GOOGLE EARTH HYDROLOGY & ARTERIAL ROADS
    // =========================================================================
    const RED_RIVER_SPLINE = interpolateSpline([
      [21.1060, 105.7550], [21.0950, 105.7880], [21.0840, 105.8160],
      [21.0640, 105.8430], [21.0420, 105.8570], [21.0180, 105.8680],
      [20.9920, 105.8880], [20.9650, 105.9080]
    ], 10);

    function runCalc() {
      const dEl = document.getElementById('c-dist');
      if (!dEl) return;
      const base = parseFloat(dEl.value);
      const area = parseFloat(document.getElementById('c-area').value);
      const walk = parseFloat(document.getElementById('c-walk').value);

      document.getElementById('c-area-lbl').textContent = `${area} m²`;
      document.getElementById('c-walk-lbl').textContent = `${walk} m`;

      let pct = 0, zTxt = 'NGOÀI VÙNG ĐI BỘ >1.500M (β = 0.0000 — Nhóm đối chiếu)', zCol = '#fb7185';
      if (walk < 500) {
        pct = 0.0041;
        zTxt = 'VÀNH ĐAI SÁT GA <500M (β = +0.0041, p = 0.415 — Khấu trừ ngoại ứng ồn)';
        zCol = '#60a5fa';
      } else if (walk <= 1000) {
        pct = 0.0391;
        zTxt = 'VÀNH ĐAI ĐI BỘ TỐI ƯU 500–1.000M (β = +0.0383*** → +3.91%, p < 0.001)';
        zCol = '#34d399';
      } else if (walk <= 1500) {
        pct = 0.0002;
        zTxt = 'VÀNH ĐAI ĐỆM 1.000–1.500M (β = +0.0002, p = 0.968 — Suy giảm theo cự ly)';
        zCol = '#fbbf24';
      }

      const baseTotal = base * area;
      const premMillion = baseTotal * pct;
      const finalTotal = (baseTotal + premMillion) / 1000;

      const zEl = document.getElementById('c-zone');
      zEl.textContent = zTxt;
      zEl.style.color = zCol;
      document.getElementById('c-total').textContent = `${finalTotal.toFixed(2)} Tỷ VNĐ`;
      document.getElementById('c-prem').textContent = `+${premMillion.toFixed(1)} Triệu VNĐ`;
      document.getElementById('c-prem').style.color = zCol;
    }

    function focusProject(id) {
      const p = PROJECTS.find(item => item.id === id);
      if (!p) return;
      state.selectedProject = p;
      // On desktop, offset camera target slightly right so the selected 3D building renders in the open left canvas area clear of the right drawer
      const desktopOffset = window.innerWidth > 720 ? 5.5 : 0;
      state.cam.goalTx = p.x + desktopOffset * Math.cos(state.cam.yaw);
      state.cam.goalTy = 2.0;
      state.cam.goalTz = p.z + desktopOffset * Math.sin(state.cam.yaw);
      state.cam.goalDist = 32;
      state.cam.goalPitch = 0.56;
      openSheet('project');
    }

    // =========================================================================
    // 6. SOLID ARCHITECTURAL 3D ENGINE & COLLISION-FREE LABELS
    // =========================================================================
    const canvas = document.getElementById('canvas3d');
    const ctx = canvas.getContext('2d');
    let cw = window.innerWidth, ch = window.innerHeight;

    function resizeCanvas() {
      cw = window.innerWidth;
      ch = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = cw * dpr;
      canvas.height = ch * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let camPos = { x: 0, y: 40, z: 40 };
    let camFwd = { x: 0, y: 0, z: -1 };
    let camRight = { x: 1, y: 0, z: 0 };
    let camUp = { x: 0, y: 1, z: 0 };
    let hitBoxes = [];
    let placedLabels = [];

    function project(wx, wy, wz) {
      const dx = wx - camPos.x;
      const dy = wy - camPos.y;
      const dz = wz - camPos.z;
      const cz = dx * camFwd.x + dy * camFwd.y + dz * camFwd.z;
      if (cz <= 1.2) return null;
      const cx = dx * camRight.x + dy * camRight.y + dz * camRight.z;
      const cy = dx * camUp.x + dy * camUp.y + dz * camUp.z;
      const focal = Math.min(cw, ch) * 0.90;
      return {
        x: cw * 0.5 + (cx / cz) * focal,
        y: ch * 0.5 - (cy / cz) * focal,
        depth: cz
      };
    }

    function tryDrawLabel(text, x, y, bgCol, textCol, borderCol, fontStr = 'bold 12px sans-serif') {
      if (x < 40 || x > cw - 40 || y < 58 || y > ch - 82) return false;
      ctx.font = fontStr;
      const padX = 8;
      const boxH = 22;
      const boxW = ctx.measureText(text).width + padX * 2;
      const left = x - boxW * 0.5;
      const top = y - boxH * 0.5;
      const right = left + boxW;
      const bottom = top + boxH;

      // Never draw 3D canvas labels that collide with or get clipped by the open #info-sheet drawer!
      const sheetEl = document.getElementById('info-sheet');
      if (sheetEl && !sheetEl.classList.contains('closed')) {
        const sLeft = cw > 640 ? (cw - 522) : 0;
        const sTop = cw > 640 ? 96 : (ch * 0.20);
        if (right > sLeft && bottom > sTop) {
          return false;
        }
      }

      for (const b of placedLabels) {
        if (left < b.right + 5 && right > b.left - 5 && top < b.bottom + 4 && bottom > b.top - 4) {
          return false;
        }
      }
      placedLabels.push({ left, right, top, bottom });

      if (bgCol) {
        ctx.fillStyle = bgCol;
        ctx.beginPath();
        ctx.roundRect(left, top, boxW, boxH, 6);
        ctx.fill();
        if (borderCol) {
          ctx.strokeStyle = borderCol;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      }
      ctx.fillStyle = textCol;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x, y);
      return true;
    }

    function drawOrientedBox3D(wx, wy, wz, tx, tz, lengthT, height, widthN, palette, opts = {}) {
      const nx = -tz, nz = tx;
      const hl = lengthT * 0.5;
      const hw = widthN * 0.5;

      const worldCorners = [
        { x: wx + tx * hl + nx * hw, z: wz + tz * hl + nz * hw },
        { x: wx + tx * hl - nx * hw, z: wz + tz * hl - nz * hw },
        { x: wx - tx * hl - nx * hw, z: wz - tz * hl - nz * hw },
        { x: wx - tx * hl + nx * hw, z: wz - tz * hl + nz * hw }
      ];

      const bPts = worldCorners.map(c => project(c.x, wy, c.z));
      const tPts = worldCorners.map(c => project(c.x, wy + height, c.z));
      if (bPts.some(p => !p) || tPts.some(p => !p)) return null;

      if (opts.shadow && wy <= 0.05) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
        ctx.beginPath();
        bPts.forEach((p, idx) => {
          if (idx === 0) ctx.moveTo(p.x + 5, p.y + 3);
          else ctx.lineTo(p.x + 5, p.y + 3);
        });
        ctx.closePath();
        ctx.fill();
      }

      const sideDefs = [
        { i0: 0, i1: 1, col: palette.front, fnx: tx,  fnz: tz  },
        { i0: 1, i1: 2, col: palette.right, fnx: -nx, fnz: -nz },
        { i0: 2, i1: 3, col: palette.back,  fnx: -tx, fnz: -tz },
        { i0: 3, i1: 0, col: palette.left,  fnx: nx,  fnz: nz  }
      ].map(sd => {
        const mx = (worldCorners[sd.i0].x + worldCorners[sd.i1].x) * 0.5;
        const my = wy + height * 0.5;
        const mz = (worldCorners[sd.i0].z + worldCorners[sd.i1].z) * 0.5;
        const vx = mx - camPos.x;
        const vy = my - camPos.y;
        const vz = mz - camPos.z;
        const distSq = vx * vx + vy * vy + vz * vz;
        const facing = (vx * sd.fnx + vz * sd.fnz) < 0;
        return { ...sd, distSq, facing };
      });

      sideDefs.sort((a, b) => b.distSq - a.distSq);

      ctx.lineWidth = opts.highlight ? 2.0 : 0.85;
      ctx.strokeStyle = opts.highlight ? '#ffffff' : (palette.stroke || 'rgba(255,255,255,0.22)');

      sideDefs.forEach(sd => {
        if (!sd.facing) return;
        const bA = bPts[sd.i0], bB = bPts[sd.i1];
        const tB = tPts[sd.i1], tA = tPts[sd.i0];

        ctx.fillStyle = sd.col;
        ctx.beginPath();
        ctx.moveTo(bA.x, bA.y);
        ctx.lineTo(bB.x, bB.y);
        ctx.lineTo(tB.x, tB.y);
        ctx.lineTo(tA.x, tA.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        if (opts.windows && height >= 3.2 && bA.depth < 72) {
          ctx.save();
          ctx.strokeStyle = opts.windowColor || 'rgba(255, 255, 255, 0.30)';
          ctx.lineWidth = 0.85;
          const floors = Math.min(9, Math.max(3, Math.floor(height * 0.72)));
          for (let f = 1; f < floors; f++) {
            const r = f / floors;
            const lx = bA.x + (tA.x - bA.x) * r;
            const ly = bA.y + (tA.y - bA.y) * r;
            const rx = bB.x + (tB.x - bB.x) * r;
            const ry = bB.y + (tB.y - bB.y) * r;
            const ix1 = lx + (rx - lx) * 0.14, iy1 = ly + (ry - ly) * 0.14;
            const ix2 = lx + (rx - lx) * 0.86, iy2 = ly + (ry - ly) * 0.86;
            ctx.beginPath();
            ctx.moveTo(ix1, iy1);
            ctx.lineTo(ix2, iy2);
            ctx.stroke();
          }
          ctx.restore();
        }

        if (opts.isTrainCar && (sd.i0 === 1 || sd.i0 === 3)) {
          const wA1x = bA.x + (tA.x - bA.x) * 0.45, wA1y = bA.y + (tA.y - bA.y) * 0.45;
          const wB1x = bB.x + (tB.x - bB.x) * 0.45, wB1y = bB.y + (tB.y - bB.y) * 0.45;
          const wA2x = bA.x + (tA.x - bA.x) * 0.80, wA2y = bA.y + (tA.y - bA.y) * 0.80;
          const wB2x = bB.x + (tB.x - bB.x) * 0.80, wB2y = bB.y + (tB.y - bB.y) * 0.80;
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.moveTo(wA1x, wA1y); ctx.lineTo(wB1x, wB1y);
          ctx.lineTo(wB2x, wB2y); ctx.lineTo(wA2x, wA2y);
          ctx.closePath();
          ctx.fill();

          const sA1x = bA.x + (tA.x - bA.x) * 0.25, sA1y = bA.y + (tA.y - bA.y) * 0.25;
          const sB1x = bB.x + (tB.x - bB.x) * 0.25, sB1y = bB.y + (tB.y - bB.y) * 0.25;
          ctx.strokeStyle = opts.liveryColor || '#10b981';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(sA1x, sA1y);
          ctx.lineTo(sB1x, sB1y);
          ctx.stroke();
        }
      });

      if (camPos.y > wy + height) {
        ctx.fillStyle = opts.highlight ? '#ffffff' : palette.top;
        ctx.beginPath();
        ctx.moveTo(tPts[0].x, tPts[0].y);
        ctx.lineTo(tPts[1].x, tPts[1].y);
        ctx.lineTo(tPts[2].x, tPts[2].y);
        ctx.lineTo(tPts[3].x, tPts[3].y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        if (opts.isTrainCar) {
          const rA = { x: (tPts[0].x + tPts[1].x) * 0.5, y: (tPts[0].y + tPts[1].y) * 0.5 };
          const rB = { x: (tPts[3].x + tPts[2].x) * 0.5, y: (tPts[3].y + tPts[2].y) * 0.5 };
          ctx.strokeStyle = opts.liveryColor || '#10b981';
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.moveTo(rA.x, rA.y);
          ctx.lineTo(rB.x, rB.y);
          ctx.stroke();

          const rcX = (tPts[0].x + tPts[2].x) * 0.5;
          const rcY = (tPts[0].y + tPts[2].y) * 0.5;
          ctx.fillStyle = '#334155';
          ctx.beginPath();
          ctx.arc(rcX, rcY, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const roofCenterX = (tPts[0].x + tPts[2].x) * 0.5;
      const roofCenterY = (tPts[0].y + tPts[2].y) * 0.5;
      const baseCenterY = (bPts[0].y + bPts[2].y) * 0.5;

      return {
        x: roofCenterX,
        y: (roofCenterY + baseCenterY) * 0.5,
        roofX: roofCenterX,
        roofY: roofCenterY,
        r: Math.max(15, Math.hypot(tPts[2].x - bPts[0].x, tPts[2].y - bPts[0].y) * 0.48),
        depth: (tPts[0].depth + bPts[2].depth) * 0.5
      };
    }

    function drawWorldRibbonPolygon(spline, halfWidthWorld, wy, fillCol, strokeCol) {
      const leftBank = [];
      const rightBank = [];
      for (let i = 0; i < spline.length; i++) {
        const pt = spline[i];
        const lP = project(pt.x + pt.nx * halfWidthWorld, wy, pt.z + pt.nz * halfWidthWorld);
        const rP = project(pt.x - pt.nx * halfWidthWorld, wy, pt.z - pt.nz * halfWidthWorld);
        if (lP && rP) {
          leftBank.push(lP);
          rightBank.push(rP);
        }
      }
      if (leftBank.length < 2) return;

      ctx.beginPath();
      leftBank.forEach((p, idx) => { if (idx === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
      for (let i = rightBank.length - 1; i >= 0; i--) {
        ctx.lineTo(rightBank[i].x, rightBank[i].y);
      }
      ctx.closePath();
      ctx.fillStyle = fillCol;
      ctx.fill();
      if (strokeCol) {
        ctx.strokeStyle = strokeCol;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
    }

    function drawGroundPolyline(pts, wy, color, widthPx, casingColor = null, dash = []) {
      const screenPts = [];
      for (let i = 0; i < pts.length; i++) {
        const sp = project(pts[i].x, wy, pts[i].z);
        if (sp) screenPts.push(sp);
      }
      if (screenPts.length < 2) return;

      ctx.save();
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      if (dash.length) ctx.setLineDash(dash);

      if (casingColor) {
        ctx.strokeStyle = casingColor;
        ctx.lineWidth = widthPx + 2.0;
        ctx.beginPath();
        screenPts.forEach((p, idx) => { if (idx === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
        ctx.stroke();
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = widthPx;
      ctx.beginPath();
      screenPts.forEach((p, idx) => { if (idx === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
      ctx.stroke();
      ctx.restore();
    }

    function drawGroundEllipse(wx, wy, wz, rx, rz, fillStyle, strokeStyle = null, lineWidth = 1.2) {
      const segs = 32;
      ctx.beginPath();
      let started = false;
      for (let i = 0; i <= segs; i++) {
        const a = (i / segs) * Math.PI * 2;
        const p = project(wx + Math.cos(a) * rx, wy, wz + Math.sin(a) * rz);
        if (p) {
          if (!started) { ctx.moveTo(p.x, p.y); started = true; }
          else ctx.lineTo(p.x, p.y);
        }
      }
      if (!started) return;
      ctx.closePath();
      if (fillStyle) { ctx.fillStyle = fillStyle; ctx.fill(); }
      if (strokeStyle) { ctx.strokeStyle = strokeStyle; ctx.lineWidth = lineWidth; ctx.stroke(); }
    }

    function sampleSpline(spline, prog) {
      const total = spline.length - 1;
      const exact = Math.max(0, Math.min(total - 0.001, prog * total));
      const idx = Math.floor(exact);
      const frac = exact - idx;
      const a = spline[idx], b = spline[idx + 1];
      return {
        x: a.x + (b.x - a.x) * frac,
        y: a.elev + (b.elev - a.elev) * frac,
        z: a.z + (b.z - a.z) * frac,
        tx: a.tx, tz: a.tz,
        nx: a.nx, nz: a.nz
      };
    }

    const TOWER_PALETTES = {
      SWEET: { top: '#6ee7b7', front: '#10b981', right: '#059669', back: '#047857', left: '#0d9488', stroke: 'rgba(167, 243, 208, 0.55)' },
      NEAR:  { top: '#93c5fd', front: '#3b82f6', right: '#2563eb', back: '#1d4ed8', left: '#0284c7', stroke: 'rgba(191, 219, 254, 0.55)' },
      BUFFER:{ top: '#fcd34d', front: '#f59e0b', right: '#d97706', back: '#b45309', left: '#ea580c', stroke: 'rgba(253, 230, 138, 0.5)' },
      FAR:   { top: '#fda4af', front: '#f43f5e', right: '#e11d48', back: '#be123c', left: '#db2777', stroke: 'rgba(254, 205, 211, 0.5)' },
      BASE:  { top: '#64748b', front: '#475569', right: '#334155', back: '#1e293b', left: '#334155', stroke: 'rgba(148, 163, 184, 0.4)' },
      GOLD:  { top: '#fde68a', front: '#10b981', right: '#059669', back: '#047857', left: '#34d399', stroke: '#fef08a' }
    };

    function drawTree3D(wx, wz) {
      const pBase = project(wx, 0, wz);
      const pTop = project(wx, 1.35, wz);
      if (!pBase || !pTop || pBase.depth > 55) return;
      const r = Math.max(3.5, 130 / pTop.depth);
      ctx.strokeStyle = '#78350f';
      ctx.lineWidth = Math.max(1.5, 50 / pBase.depth);
      ctx.beginPath();
      ctx.moveTo(pBase.x, pBase.y);
      ctx.lineTo(pTop.x, pTop.y);
      ctx.stroke();

      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.arc(pTop.x, pTop.y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#34d399';
      ctx.beginPath();
      ctx.arc(pTop.x - r * 0.25, pTop.y - r * 0.25, r * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }

    // =========================================================================
    // 7. MAIN 60FPS RENDER LOOP
    // =========================================================================
    function render() {
      state.time += 0.016;
      hitBoxes = [];
      placedLabels = [];
      const isOSM = state.mapTheme === 'osm';

      state.trains.forEach(tr => {
        tr.prog += tr.dir * tr.speed;
        if (tr.prog >= 0.96) { tr.prog = 0.96; tr.dir = -1; }
        if (tr.prog <= 0.04) { tr.prog = 0.04; tr.dir = 1; }
      });

      const c = state.cam;
      if (state.followTrain) {
        const tp = sampleSpline(LINE_2A_SPLINE, state.trains[0].prog);
        c.goalTx = tp.x; c.goalTy = tp.y + 1.2; c.goalTz = tp.z;
        c.goalDist = 22; c.goalPitch = 0.42;
        c.goalYaw += 0.0025;
      }

      c.tx += (c.goalTx - c.tx) * 0.085;
      c.ty += (c.goalTy - c.ty) * 0.085;
      c.tz += (c.goalTz - c.tz) * 0.085;
      c.yaw += (c.goalYaw - c.yaw) * 0.085;
      c.pitch = Math.max(0.24, Math.min(1.35, c.pitch + (c.goalPitch - c.pitch) * 0.085));
      c.dist = Math.max(15, Math.min(145, c.dist + (c.goalDist - c.dist) * 0.085));

      camPos.x = c.tx - Math.sin(c.yaw) * Math.cos(c.pitch) * c.dist;
      camPos.y = c.ty + Math.sin(c.pitch) * c.dist;
      camPos.z = c.tz + Math.cos(c.yaw) * Math.cos(c.pitch) * c.dist;

      const fx = c.tx - camPos.x, fy = c.ty - camPos.y, fz = c.tz - camPos.z;
      const fl = Math.hypot(fx, fy, fz) || 1;
      camFwd = { x: fx / fl, y: fy / fl, z: fz / fl };
      const rl = Math.hypot(-camFwd.z, 0, camFwd.x) || 1;
      camRight = { x: -camFwd.z / rl, y: 0, z: camFwd.x / rl };
      camUp = {
        x: camRight.y * camFwd.z - camRight.z * camFwd.y,
        y: camRight.z * camFwd.x - camRight.x * camFwd.z,
        z: camRight.x * camFwd.y - camRight.y * camFwd.x
      };

      // 1. BACKGROUND SKY / SURFACE
      if (isOSM) {
        ctx.fillStyle = '#f2efe9';
        ctx.fillRect(0, 0, cw, ch);
      } else {
        const bgGrad = ctx.createLinearGradient(0, 0, 0, ch);
        bgGrad.addColorStop(0, '#040914');
        bgGrad.addColorStop(0.5, '#091526');
        bgGrad.addColorStop(1, '#0d1f36');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, cw, ch);
      }

      // 2. SUBTLE WGS84 COORDINATE GRID
      ctx.strokeStyle = isOSM ? 'rgba(148, 163, 184, 0.2)' : 'rgba(56, 189, 248, 0.06)';
      ctx.lineWidth = 1;
      for (let g = -80; g <= 80; g += 8) {
        const p1 = project(g, 0, -80), p2 = project(g, 0, 80);
        if (p1 && p2) { ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
        const q1 = project(-80, 0, g), q2 = project(80, 0, g);
        if (q1 && q2) { ctx.beginPath(); ctx.moveTo(q1.x, q1.y); ctx.lineTo(q2.x, q2.y); ctx.stroke(); }
      }

      // 3. GREEN PARKS
      const parkFill = isOSM ? '#c8facc' : 'rgba(16, 185, 129, 0.10)';
      const parkStroke = isOSM ? '#86efac' : 'rgba(16, 185, 129, 0.25)';
      HANOI_PARKS.forEach(pk => {
        drawGroundEllipse(pk.x, 0.02, pk.z, pk.rx, pk.rz, parkFill, parkStroke);
      });

      // 4. RIVERS & LAKES
      const waterFill = isOSM ? '#aad3df' : 'rgba(14, 165, 233, 0.26)';
      const waterStroke = isOSM ? '#7ab8cc' : 'rgba(56, 189, 248, 0.45)';

      drawWorldRibbonPolygon(RED_RIVER_SPLINE, 2.8, 0.03, waterFill, waterStroke);
      drawWorldRibbonPolygon(TO_LICH_RIVER, 0.22, 0.03, waterFill, null);
      drawWorldRibbonPolygon(NHUE_RIVER, 0.30, 0.03, waterFill, null);
      drawWorldRibbonPolygon(DAY_RIVER, 0.35, 0.03, waterFill, null);

      ctx.beginPath();
      let htStart = false;
      HO_TAY_POLY.forEach(wPt => {
        const sp = project(wPt.x, 0.04, wPt.z);
        if (sp) { if (!htStart) { ctx.moveTo(sp.x, sp.y); htStart = true; } else ctx.lineTo(sp.x, sp.y); }
      });
      if (htStart) {
        ctx.closePath();
        ctx.fillStyle = waterFill; ctx.fill();
        ctx.strokeStyle = waterStroke; ctx.lineWidth = 1.4; ctx.stroke();
      }

      HANOI_LAKES.forEach(lk => {
        drawGroundEllipse(lk.x, 0.04, lk.z, lk.rx, lk.rz, waterFill, waterStroke);
      });

      // 5. OPENSTREETMAP / GOOGLE EARTH ROAD NETWORK
      OSM_ROADS.forEach(rd => {
        if (rd.type === 'motorway') {
          drawGroundPolyline(rd.pts, 0.06, isOSM ? '#f9b29c' : 'rgba(245, 158, 11, 0.42)', 4.2, isOSM ? '#e07a5f' : 'rgba(251, 191, 36, 0.2)');
        } else if (rd.type === 'primary') {
          drawGroundPolyline(rd.pts, 0.05, isOSM ? '#fcd6a4' : 'rgba(148, 163, 184, 0.28)', 3.0, isOSM ? '#dfb070' : null);
        } else {
          drawGroundPolyline(rd.pts, 0.04, isOSM ? '#ffffff' : 'rgba(100, 116, 139, 0.22)', 2.0, isOSM ? '#cbd5e1' : null);
        }
      });

      // 6. TOD ZONES & NUISANCE BUFFER RINGS AROUND ACTIVE STATION
      const activeProj = state.selectedProject || PROJECTS[0];
      if (activeProj) {
        drawGroundEllipse(activeProj.sx, 0.08, activeProj.sz, 8.2, 8.2, 'rgba(16, 185, 129, 0.14)', '#10b981', 1.8);
        drawGroundEllipse(activeProj.sx, 0.09, activeProj.sz, 4.1, 4.1, 'rgba(244, 63, 94, 0.12)', '#f43f5e', 1.5);

        const wavePhase = (state.time * 1.4) % 1;
        const waveR = 0.8 + wavePhase * 3.3;
        drawGroundEllipse(
          activeProj.sx, 0.12, activeProj.sz,
          waveR, waveR,
          null,
          `rgba(251, 113, 133, ${(1 - wavePhase) * 0.75})`,
          2.0
        );
      }

      // 7. 3D CURVED METRO VIADUCTS
      function drawViaduct3D(spline, mainColor) {
        drawGroundPolyline(spline, 0.09, 'rgba(0, 0, 0, 0.30)', 5.0);

        for (let i = 0; i < spline.length; i += 3) {
          const pt = spline[i];
          if (pt.elev <= 0.6) continue;
          const gP = project(pt.x, 0, pt.z);
          const tP = project(pt.x, pt.elev, pt.z);
          if (gP && tP) {
            ctx.strokeStyle = isOSM ? '#64748b' : 'rgba(148, 163, 184, 0.72)';
            ctx.lineWidth = Math.max(1.6, 120 / tP.depth);
            ctx.beginPath();
            ctx.moveTo(gP.x, gP.y);
            ctx.lineTo(tP.x, tP.y);
            ctx.stroke();
          }
        }

        const elevPts = [];
        const underPts = [];
        spline.forEach(pt => {
          const sp = project(pt.x, pt.elev, pt.z);
          if (!sp) return;
          if (pt.elev > 0.6) elevPts.push(sp);
          else underPts.push(sp);
        });

        if (elevPts.length > 1) {
          ctx.save();
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';

          ctx.strokeStyle = isOSM ? '#475569' : '#1e293b';
          ctx.lineWidth = 6.5;
          ctx.beginPath();
          elevPts.forEach((p, idx) => { if (idx === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
          ctx.stroke();

          ctx.strokeStyle = mainColor;
          ctx.lineWidth = 3.8;
          ctx.beginPath();
          elevPts.forEach((p, idx) => { if (idx === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
          ctx.stroke();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.lineWidth = 1.0;
          ctx.beginPath();
          elevPts.forEach((p, idx) => { if (idx === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
          ctx.stroke();
          ctx.restore();
        }

        if (underPts.length > 1) {
          ctx.save();
          ctx.strokeStyle = mainColor;
          ctx.lineWidth = 3.0;
          ctx.setLineDash([5, 4]);
          ctx.beginPath();
          underPts.forEach((p, idx) => { if (idx === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
          ctx.stroke();
          ctx.restore();
        }
      }

      drawViaduct3D(LINE_2A_SPLINE, '#10b981');
      drawViaduct3D(LINE_3_SPLINE, '#3b82f6');

      // 8. DEPTH-SORTED 3D OBJECTS
      const renderQueue = [];
      const pendingLabels = [];

      // 8A. Green Buffer inside 500m-1000m Sweet Spot
      if (activeProj) {
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 5) {
          const tx = activeProj.sx + Math.cos(a) * 4.6;
          const tz = activeProj.sz + Math.sin(a) * 4.6;
          const pt = project(tx, 0.6, tz);
          if (pt) {
            renderQueue.push({
              depth: pt.depth,
              draw: () => drawTree3D(tx, tz)
            });
          }
        }
      }

      // 8B. Background Urban Fabric Towers
      URBAN_BLOCKS.forEach(b => {
        if (state.step === 2 && Math.hypot(b.x - activeProj.sx, b.z - activeProj.sz) < 12) return;
        const pt = project(b.x, b.h * 0.5, b.z);
        if (!pt) return;
        const pal = isOSM
          ? { top: '#e2e8f0', front: '#cbd5e1', right: '#94a3b8', back: '#64748b', left: '#94a3b8', stroke: 'rgba(100,116,139,0.35)' }
          : (b.zone === 'SWEET'
            ? { top: '#059669', front: '#047857', right: '#065f46', back: '#064e3b', left: '#065f46', stroke: 'rgba(52,211,153,0.28)' }
            : { top: '#334155', front: '#1e293b', right: '#0f172a', back: '#090d16', left: '#1e293b', stroke: 'rgba(148,163,184,0.2)' });

        renderQueue.push({
          depth: pt.depth,
          draw: () => drawOrientedBox3D(b.x, 0, b.z, 1, 0, b.w, b.h, b.w, pal, { shadow: true, windows: true, windowColor: isOSM ? 'rgba(71,85,105,0.25)' : 'rgba(148,163,184,0.18)' })
        });
      });

      // 8C. 23 Oriented 3D Metro Stations
      STATIONS.forEach(st => {
        const pt = project(st.x, st.elev, st.z);
        if (!pt) return;
        const pal = st.line === '2A'
          ? { top: '#1e293b', front: '#065f46', right: '#0f172a', back: '#065f46', left: '#0f172a', stroke: '#34d399' }
          : { top: '#1e293b', front: '#1e40af', right: '#0f172a', back: '#1e40af', left: '#0f172a', stroke: '#60a5fa' };

        renderQueue.push({
          depth: pt.depth - 0.6,
          draw: () => {
            const box = drawOrientedBox3D(st.x, st.elev - 0.32, st.z, st.tx, st.tz, 2.35, 0.78, 1.28, pal, { highlight: false });
            if (!box) return;
            hitBoxes.push({ x: box.x, y: box.y, r: box.r + 5, depth: box.depth, type: 'station', data: st });

            ctx.fillStyle = st.line === '2A' ? '#10b981' : '#3b82f6';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(box.roofX, box.roofY - 3, 4.0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            if (st.major) {
              pendingLabels.push({
                priority: 4,
                text: st.name,
                x: box.roofX,
                y: box.roofY - 16,
                bg: isOSM ? 'rgba(255,255,255,0.92)' : 'rgba(15,23,42,0.88)',
                fg: isOSM ? '#0f172a' : '#f8fafc',
                border: st.line === '2A' ? 'rgba(16,185,129,0.6)' : 'rgba(59,130,246,0.6)',
                font: '600 12px sans-serif'
              });
            }
          }
        });
      });

      // 8D. Streamlined 4-Car Articulated 3D Metro Trains
      state.trains.forEach(tr => {
        const spline = tr.line === '2A' ? LINE_2A_SPLINE : LINE_3_SPLINE;
        const trainPal = tr.line === '2A'
          ? { top: '#ffffff', front: '#059669', right: '#f1f5f9', back: '#059669', left: '#ffffff', stroke: '#10b981' }
          : { top: '#ffffff', front: '#2563eb', right: '#f1f5f9', back: '#2563eb', left: '#ffffff', stroke: '#3b82f6' };

        for (let car = -1.5; car <= 1.5; car += 1.0) {
          const pCar = Math.max(0.01, Math.min(0.99, tr.prog + car * 0.022));
          const pos = sampleSpline(spline, pCar);
          const pt = project(pos.x, pos.y + 0.5, pos.z);
          if (!pt) continue;

          const isLeadCar = (tr.dir > 0 && car === 1.5) || (tr.dir < 0 && car === -1.5);

          renderQueue.push({
            depth: pt.depth - 1.2,
            draw: () => {
              drawOrientedBox3D(pos.x, pos.y + 0.16, pos.z, pos.tx, pos.tz, 1.32, 0.70, 0.78, trainPal, {
                highlight: false,
                isTrainCar: true,
                liveryColor: tr.color
              });

              if (isLeadCar) {
                const dirSign = tr.dir > 0 ? 1 : -1;
                const h1 = project(pos.x + pos.tx * dirSign * 0.75, pos.y + 0.42, pos.z + pos.tz * dirSign * 0.75);
                const h2 = project(pos.x + pos.tx * dirSign * 3.4 + pos.nx * 0.85, pos.y + 0.2, pos.z + pos.tz * dirSign * 3.4 + pos.nz * 0.85);
                const h3 = project(pos.x + pos.tx * dirSign * 3.4 - pos.nx * 0.85, pos.y + 0.2, pos.z + pos.tz * dirSign * 3.4 - pos.nz * 0.85);
                if (h1 && h2 && h3) {
                  ctx.fillStyle = 'rgba(254, 240, 138, 0.38)';
                  ctx.beginPath();
                  ctx.moveTo(h1.x, h1.y);
                  ctx.lineTo(h2.x, h2.y);
                  ctx.lineTo(h3.x, h3.y);
                  ctx.closePath();
                  ctx.fill();
                }
              }
            }
          });
        }
      });

      // 8E. Featured Architectural 3D Apartment Complexes (With Sample Size n & District FE Normalizer)
      PROJECTS.forEach(p => {
        if (state.step === 2 && p.id === activeProj.id) return;
        const isSel = state.selectedProject && state.selectedProject.id === p.id;

        const baseH = (state.step === 3 && state.proofView === 'bonus')
          ? 4.2
          : 4.5 + Math.min(6.8, (p.price - 42) * 0.095);

        const bonusH = p.zone === 'SWEET' ? 3.2 : (p.zone === 'NEAR' ? 0.55 : 0.15);
        const totalH = (state.step === 3 && state.proofView === 'bonus') ? (baseH + bonusH) : baseH;

        const pt = project(p.x, totalH * 0.5, p.z);
        if (!pt) return;

        const pal = TOWER_PALETTES[p.zone] || TOWER_PALETTES.FAR;

        renderQueue.push({
          depth: pt.depth - 0.9,
          draw: () => {
            if (state.step === 3 && state.proofView === 'bonus') {
              drawOrientedBox3D(p.x, 0, p.z, 1, 0, 1.8, baseH, 1.8, TOWER_PALETTES.BASE, { shadow: true, windows: true });
              const topBox = drawOrientedBox3D(p.x, baseH, p.z, 1, 0, 1.85, bonusH, 1.85, pal, { highlight: isSel || p.zone === 'SWEET' });
              if (!topBox) return;
              hitBoxes.push({ x: topBox.x, y: topBox.y, r: topBox.r + 8, depth: topBox.depth, type: 'project', data: p });

              if (isSel || p.zone === 'SWEET' || topBox.depth < 52) {
                const bTxt = p.zone === 'SWEET' ? `+3.91%*** • ${p.name.split(' (')[0]} (n=${p.nObs})` : (p.zone === 'NEAR' ? `+0.41% ns • ${p.name.split(' (')[0]}` : `0.00% • ${p.name.split(' (')[0]}`);
                pendingLabels.push({
                  priority: isSel ? 1 : 2,
                  text: bTxt,
                  x: topBox.roofX,
                  y: topBox.roofY - 14,
                  bg: p.zone === 'SWEET' ? '#10b981' : 'rgba(15, 23, 42, 0.92)',
                  fg: p.zone === 'SWEET' ? '#022c22' : '#ffffff',
                  border: pal.front,
                  font: 'bold 12px sans-serif'
                });
              }
            } else if (p.twin) {
              drawOrientedBox3D(p.x, 0, p.z, 1, 0, 2.8, 1.05, 1.9, pal, { shadow: true });
              drawOrientedBox3D(p.x - 0.65, 1.05, p.z, 1, 0, 1.15, (totalH - 1.05) * 0.86, 1.35, pal, {
                highlight: isSel,
                windows: true,
                windowColor: 'rgba(255, 255, 255, 0.36)'
              });
              const box = drawOrientedBox3D(p.x + 0.65, 1.05, p.z, 1, 0, 1.25, totalH - 1.05, 1.45, pal, {
                highlight: isSel,
                windows: true,
                windowColor: 'rgba(255, 255, 255, 0.42)'
              });
              if (!box) return;
              const crown = drawOrientedBox3D(p.x + 0.65, totalH, p.z, 1, 0, 0.85, 0.55, 0.95, pal, { highlight: isSel });
              const topX = crown ? crown.roofX : box.roofX;
              const topY = crown ? crown.roofY : box.roofY;

              hitBoxes.push({ x: box.x, y: box.y, r: box.r + 8, depth: box.depth, type: 'project', data: p });

              if (isSel || box.depth < 62) {
                pendingLabels.push({
                  priority: isSel ? 1 : 2,
                  text: isSel ? `★ ${p.name.split(' (')[0]} • ${p.price}tr (n=${p.nObs})` : `${p.name.split(' (')[0]} (${p.price}tr • n=${p.nObs})`,
                  x: topX,
                  y: topY - 14,
                  bg: isSel ? '#10b981' : 'rgba(15, 23, 42, 0.92)',
                  fg: isSel ? '#022c22' : '#ffffff',
                  border: isSel ? '#ffffff' : pal.front,
                  font: isSel ? 'bold 12px sans-serif' : '600 12px sans-serif'
                });
              }
            } else {
              drawOrientedBox3D(p.x, 0, p.z, 1, 0, 2.2, 1.05, 2.2, pal, { shadow: true });
              const box = drawOrientedBox3D(p.x, 1.05, p.z, 1, 0, 1.65, totalH - 1.05, 1.65, pal, {
                highlight: isSel,
                windows: true,
                windowColor: 'rgba(255, 255, 255, 0.40)'
              });
              if (!box) return;
              const crown = drawOrientedBox3D(p.x, totalH, p.z, 1, 0, 1.05, 0.60, 1.05, pal, { highlight: isSel });
              const topX = crown ? crown.roofX : box.roofX;
              const topY = crown ? crown.roofY : box.roofY;

              hitBoxes.push({ x: box.x, y: box.y, r: box.r + 6, depth: box.depth, type: 'project', data: p });

              if (isSel || box.depth < 62) {
                pendingLabels.push({
                  priority: isSel ? 1 : 2,
                  text: isSel ? `★ ${p.name.split(' (')[0]} • ${p.price}tr (n=${p.nObs})` : `${p.name.split(' (')[0]} (${p.price}tr • n=${p.nObs})`,
                  x: topX,
                  y: topY - 14,
                  bg: isSel ? '#10b981' : 'rgba(15, 23, 42, 0.92)',
                  fg: isSel ? '#022c22' : '#ffffff',
                  border: isSel ? '#ffffff' : pal.front,
                  font: isSel ? 'bold 12px sans-serif' : '600 12px sans-serif'
                });
              }
            }
          }
        });
      });

      // 8F. STEP 2 INTERACTIVE MOVABLE 3D TEST BUILDING (SCIENTIFIC PARAMETER SIMULATION)
      if (state.step === 2 && activeProj) {
        const dm = state.experimentDist;
        const worldDist = (dm / 1000) * 8.2;
        const dirX = 0.88, dirZ = 0.47;
        const testX = activeProj.sx + dirX * worldDist;
        const testZ = activeProj.sz + dirZ * worldDist;

        const isNear = dm < 500;
        const isSweet = dm >= 500 && dm <= 1000;
        const bonusH = isSweet ? 3.4 : (isNear ? 0.5 : 0.15);
        const pal = isSweet ? TOWER_PALETTES.GOLD : (isNear ? TOWER_PALETTES.NEAR : TOWER_PALETTES.FAR);

        const pt = project(testX, 4.0, testZ);
        if (pt) {
          renderQueue.push({
            depth: pt.depth - 2.0,
            draw: () => {
              drawOrientedBox3D(testX, 0, testZ, 1, 0, 2.2, 5.2, 2.2, TOWER_PALETTES.BASE, { shadow: true, windows: true });
              const topB = drawOrientedBox3D(testX, 5.2, testZ, 1, 0, 2.25, bonusH, 2.25, pal, { highlight: true });
              if (!topB) return;

              const headline = isSweet
                ? `CỰ LY ${dm}M (VÀNH ĐAI 500–1000M): β = +0.0383*** (+3.91%)`
                : (isNear
                  ? `CỰ LY ${dm}M (VÀNH ĐAI <500M): β = +0.0041 (p = 0.415, ns)`
                  : `CỰ LY ${dm}M (NGOÀI VÙNG TOD): β = 0.0000 (Nhóm đối chiếu)`);

              pendingLabels.push({
                priority: 0,
                text: headline,
                x: topB.roofX,
                y: topB.roofY - 18,
                bg: isSweet ? '#10b981' : (isNear ? '#2563eb' : '#e11d48'),
                fg: isSweet ? '#022c22' : '#ffffff',
                border: '#ffffff',
                font: 'bold 12px sans-serif'
              });
            }
          });
        }
      }

      renderQueue.sort((a, b) => b.depth - a.depth);
      renderQueue.forEach(item => item.draw());

      // 9. 3D VISUALIZATION OF EUCLIDEAN VS. GIS NETWORK DISTANCE
      if ((state.step === 1 || state.step === 2) && activeProj) {
        const targetX = state.step === 2
          ? activeProj.sx + 0.88 * ((state.experimentDist / 1000) * 8.2)
          : activeProj.x;
        const targetZ = state.step === 2
          ? activeProj.sz + 0.47 * ((state.experimentDist / 1000) * 8.2)
          : activeProj.z;
        const walkMeters = state.step === 2 ? state.experimentDist : activeProj.walk;
        const euclidMeters = state.step === 2 ? Math.round(walkMeters * 0.76) : activeProj.euclid;

        const bPt = project(targetX, 0.18, targetZ);
        const midPt = project(activeProj.sx, 0.18, targetZ);
        const sPt = project(activeProj.sx, 0.18, activeProj.sz);
        if (bPt && midPt && sPt) {
          ctx.save();
          ctx.strokeStyle = walkMeters <= 1000 ? '#10b981' : '#f43f5e';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(bPt.x, bPt.y);
          ctx.lineTo(midPt.x, midPt.y);
          ctx.lineTo(sPt.x, sPt.y);
          ctx.stroke();

          for (let d = 0; d < 5; d++) {
            const u = ((state.time * 0.45) + d * 0.2) % 1;
            const wx = u < 0.5 ? (targetX + (activeProj.sx - targetX) * (u * 2)) : activeProj.sx;
            const wz = u < 0.5 ? targetZ : (targetZ + (activeProj.sz - targetZ) * ((u - 0.5) * 2));
            const dotP = project(wx, 0.24, wz);
            if (dotP) {
              ctx.fillStyle = '#fef08a';
              ctx.beginPath();
              ctx.arc(dotP.x, dotP.y, 3.2, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.restore();

          pendingLabels.push({
            priority: 1,
            text: `GIS Network: ${walkMeters}m`,
            x: midPt.x,
            y: midPt.y + 14,
            bg: 'rgba(6, 78, 59, 0.92)',
            fg: '#6ee7b7',
            border: '#10b981',
            font: 'bold 12px sans-serif'
          });
        }

        ctx.save();
        ctx.strokeStyle = 'rgba(251, 191, 36, 0.85)';
        ctx.lineWidth = 2.0;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        let arcMid = null;
        for (let s = 0; s <= 16; s++) {
          const u = s / 16;
          const ax = targetX + (activeProj.sx - targetX) * u;
          const az = targetZ + (activeProj.sz - targetZ) * u;
          const ay = 1.2 + Math.sin(u * Math.PI) * 4.5;
          const ap = project(ax, ay, az);
          if (ap) {
            if (s === 0) ctx.moveTo(ap.x, ap.y);
            else ctx.lineTo(ap.x, ap.y);
            if (s === 8) arcMid = ap;
          }
        }
        ctx.stroke();
        ctx.restore();

        if (arcMid && state.step === 1) {
          pendingLabels.push({
            priority: 2,
            text: `Euclidean: ${euclidMeters}m`,
            x: arcMid.x,
            y: arcMid.y - 10,
            bg: 'rgba(15, 23, 42, 0.88)',
            fg: '#fde68a',
            border: 'rgba(251, 191, 36, 0.6)',
            font: '600 12px sans-serif'
          });
        }
      }

      // 10. STEP 3 HOLOGRAPHIC INVERTED-U ARCH & 4 ZONE ECONOMETRIC PILLARS
      if (state.step === 3 && activeProj) {
        const ox = activeProj.sx, oz = activeProj.sz;
        const dirX = 0.88, dirZ = 0.47;

        const zonePillars = [
          { r: 2.5, h: 2.2, pal: TOWER_PALETTES.NEAR,   lbl: '<500m: +0.41% (ns)' },
          { r: 6.2, h: 10.8, pal: TOWER_PALETTES.GOLD,  lbl: '500–1000m: +3.91% ***' },
          { r: 10.2, h: 1.6, pal: TOWER_PALETTES.BUFFER,lbl: '1000–1500m: +0.02% (ns)' },
          { r: 14.0, h: 1.2, pal: TOWER_PALETTES.FAR,   lbl: '>1500m: 0.00% (Ref)' }
        ];
        zonePillars.forEach((zp, idx) => {
          const px = ox + dirX * zp.r;
          const pz = oz + dirZ * zp.r;
          const box = drawOrientedBox3D(px, 0, pz, dirX, dirZ, 1.4, zp.h, 1.4, zp.pal, { highlight: idx === 1, shadow: true });
          if (box) {
            pendingLabels.push({
              priority: idx === 1 ? 0 : 1,
              text: zp.lbl,
              x: box.roofX,
              y: box.roofY - 14,
              bg: idx === 1 ? '#10b981' : 'rgba(15, 23, 42, 0.92)',
              fg: idx === 1 ? '#022c22' : '#ffffff',
              border: idx === 1 ? '#ffffff' : zp.pal.front,
              font: 'bold 12px sans-serif'
            });
          }
        });

        ctx.save();
        ctx.strokeStyle = '#fde68a';
        ctx.lineWidth = 4.0;
        ctx.beginPath();
        for (let r = 0; r <= 32; r++) {
          const distU = (r / 32) * 15.0;
          const dm = (distU / 8.2) * 1000;
          const hy = dm < 500
            ? 1.5 + (dm / 500) * 2.2
            : (dm <= 1000
              ? 11.4 - Math.pow((dm - 750) / 250, 2) * 3.5
              : Math.max(1.2, 7.9 * (1 - (dm - 1000) / 550)));
          const pt = project(ox + dirX * distU, hy, oz + dirZ * distU);
          if (pt) {
            if (r === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
          }
        }
        ctx.stroke();
        ctx.restore();
      }

      // 11. LANDMARK WATER LABELS
      const htCenter = gpsToWorld(21.0635, 105.8210);
      const htLbl = project(htCenter.x, 0.2, htCenter.z);
      if (htLbl) {
        pendingLabels.push({
          priority: 3, text: 'HỒ TÂY', x: htLbl.x, y: htLbl.y,
          bg: null, fg: isOSM ? '#0369a1' : '#38bdf8', border: null, font: 'bold 12px sans-serif'
        });
      }
      const shCenter = gpsToWorld(21.062, 105.847);
      const shLbl = project(shCenter.x, 0.2, shCenter.z);
      if (shLbl) {
        pendingLabels.push({
          priority: 3, text: 'SÔNG HỒNG', x: shLbl.x, y: shLbl.y,
          bg: null, fg: isOSM ? '#0369a1' : '#38bdf8', border: null, font: 'bold 12px sans-serif'
        });
      }

      // 12. RENDER COLLISION-FREE LABELS
      pendingLabels.sort((a, b) => a.priority - b.priority);
      pendingLabels.forEach(lbl => {
        tryDrawLabel(lbl.text, lbl.x, lbl.y, lbl.bg, lbl.fg, lbl.border, lbl.font);
      });

      requestAnimationFrame(render);
    }

    // =========================================================================
    // 8. UNIFIED DESKTOP & MOBILE GESTURES
    // =========================================================================
    let isDown = false, dragMode = 'orbit', sx = 0, sy = 0, lx = 0, ly = 0, pinchDist = 0;

    function onTap(cx, cy) {
      let hit = null, minD = Infinity;
      for (const h of hitBoxes) {
        const d = Math.hypot(cx - h.x, cy - h.y);
        if (d <= h.r && h.depth < minD) {
          minD = h.depth;
          hit = h;
        }
      }
      if (hit) {
        if (hit.type === 'project') {
          focusProject(hit.data.id);
        } else if (hit.type === 'station') {
          state.selectedStation = hit.data;
          state.cam.goalTx = hit.data.x;
          state.cam.goalTz = hit.data.z;
          state.cam.goalDist = 26;
          openSheet('station');
        }
      } else {
        closeSheet();
      }
    }

    canvas.addEventListener('mousedown', e => {
      isDown = true;
      dragMode = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
      sx = lx = e.clientX;
      sy = ly = e.clientY;
    });

    window.addEventListener('mousemove', e => {
      if (!isDown) return;
      const dx = e.clientX - lx, dy = e.clientY - ly;
      lx = e.clientX; ly = e.clientY;
      if (dragMode === 'orbit') {
        state.cam.goalYaw -= dx * 0.0065;
        state.cam.goalPitch += dy * 0.0055;
      } else {
        const pf = state.cam.dist * 0.0018;
        state.cam.goalTx -= (dx * Math.cos(state.cam.yaw) - dy * Math.sin(state.cam.yaw)) * pf;
        state.cam.goalTz -= (dx * Math.sin(state.cam.yaw) + dy * Math.cos(state.cam.yaw)) * pf;
      }
    });

    window.addEventListener('mouseup', e => {
      if (!isDown) return;
      isDown = false;
      if (Math.hypot(e.clientX - sx, e.clientY - sy) < 6) onTap(e.clientX, e.clientY);
    });

    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      state.cam.goalDist += e.deltaY * 0.06;
    }, { passive: false });

    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        isDown = true;
        sx = lx = e.touches[0].clientX;
        sy = ly = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        isDown = false;
        pinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', e => {
      if (e.touches.length === 1 && isDown) {
        const cx = e.touches[0].clientX, cy = e.touches[0].clientY;
        state.cam.goalYaw -= (cx - lx) * 0.007;
        state.cam.goalPitch += (cy - ly) * 0.006;
        lx = cx; ly = cy;
      } else if (e.touches.length === 2 && pinchDist > 0) {
        const nd = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        state.cam.goalDist -= (nd - pinchDist) * 0.22;
        pinchDist = nd;
      }
    }, { passive: true });

    canvas.addEventListener('touchend', e => {
      if (isDown && e.changedTouches.length === 1) {
        const tx = e.changedTouches[0].clientX, ty = e.changedTouches[0].clientY;
        if (Math.hypot(tx - sx, ty - sy) < 10) onTap(tx, ty);
      }
      isDown = false;
      pinchDist = 0;
    }, { passive: true });

    // Optional URL parameter support for automated visual testing (?step=2, ?proj=P5, ?tab=districts)
    const params = new URLSearchParams(window.location.search);
    if (params.get('step')) {
      setStep(Number(params.get('step')));
      state.cam.tx = state.cam.goalTx;
      state.cam.ty = state.cam.goalTy;
      state.cam.tz = state.cam.goalTz;
      state.cam.yaw = state.cam.goalYaw;
      state.cam.pitch = state.cam.goalPitch;
      state.cam.dist = state.cam.goalDist;
    }
    if (params.get('proj')) {
      focusProject(params.get('proj'));
      state.cam.tx = state.cam.goalTx;
      state.cam.ty = state.cam.goalTy;
      state.cam.tz = state.cam.goalTz;
      state.cam.yaw = state.cam.goalYaw;
      state.cam.pitch = state.cam.goalPitch;
      state.cam.dist = state.cam.goalDist;
    }
    if (params.get('tab')) {
      switchSummaryTab(params.get('tab'));
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
