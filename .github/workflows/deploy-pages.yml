name: Deploy Hanoi Metro 3D Odyssey to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Synthesize Vietnamese Neural TTS Audio (Edge-TTS with committed MP3 fallback)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg || true
          pip install edge-tts || true
          PREFER_EDGE_TTS=1 python3 src/audio/generate_narration_tts.py || echo "Using pre-generated MP3 audio files in assets/audio/"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
